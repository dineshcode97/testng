name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:danny

    - name: Save Docker image
      run: docker save my-image-name:danny -o image.tar

    - name: Upload Dockerimage
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: image.tar
        
  test:

    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Download Dockerimage
      uses: actions/download-artifact@v4
      with:
        name: docker-image

    - name: Load Image
      run: docker load -i  image.tar

    - name: Run Container
      run: docker run -dit my-image-name:danny
  
